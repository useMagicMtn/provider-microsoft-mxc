name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: provider
    steps:
      - uses: actions/checkout@v7
        with:
          path: provider
          persist-credentials: false
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat SDK_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MAGICMTN_SDK_REPOSITORY || 'useMagicMtn/magicmtn' }}
          ref: ${{ vars.MAGICMTN_SDK_REF || steps.sdk.outputs.revision }}
          path: magicmtn
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Use SDK patches
        run: cp .cargo/config.toml.example .cargo/config.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - name: Enable Linux containment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Native containment
        if: runner.os != 'Windows'
        run: cargo test --locked --test containment -- --ignored
